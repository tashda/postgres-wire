name: Build and Test

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'

      - name: Build
        run: swift build

  unit-tests:
    name: Unit Tests (PostgresWire)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'

      - name: Run Unit Tests
        run: swift test --filter PostgresWireTests

  integration-tests:
    name: Integration Tests (Postgres ${{ matrix.postgres-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Full matrix for PRs to main or pushes to main. 
        # Single version for regular pushes to dev.
        postgres-version: >-
          ${{ (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') 
              && fromJSON('["12", "13", "14", "15", "16", "17", "18", "latest"]') 
              || fromJSON('["latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.2'

      - name: Run Integration Tests
        env:
          USE_DOCKER: "1"
          POSTGRES_VERSION: ${{ matrix.postgres-version }}
          POSTGRES_PORT: "54321"
        run: swift test --filter PostgresKitTests
