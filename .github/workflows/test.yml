name: "Developer Workflow: Integration & Validation"

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Step 1: Compilation Check (Swift 6)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.2.4'

      - name: Build library
        run: swift build

      - name: Build tests
        run: swift build --build-tests

  unit-tests:
    name: "Step 2: Rapid Unit Tests (PostgresWire)"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.2.4'

      - name: Run Unit Tests
        run: swift test --filter PostgresWireTests

  smoke-tests:
    name: "Step 3: Rapid Functional Validation (PG 17)"
    needs: build
    # Only run on pushes to dev or PRs to dev. Not on PRs to main (where matrix-tests run).
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref != 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.2.4'

      - name: Run Integration Tests
        env:
          USE_DOCKER: "1"
          POSTGRES_VERSION: "17"
          POSTGRES_PORT: "54321"
        run: swift test --filter PostgresKitTests

  matrix-tests:
    name: "Step 4: Compatibility - ${{ matrix.name }}"
    needs: build
    # Only run on Pull Requests to main or pushes to main.
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Active Release (PostgreSQL 14)"
            version: "14"
          - name: "Active Release (PostgreSQL 15)"
            version: "15"
          - name: "Active Release (PostgreSQL 16)"
            version: "16"
          - name: "Current Stable (PostgreSQL 17)"
            version: "17"
          - name: "Experimental (PostgreSQL 18)"
            version: "18"
          - name: "Rolling (PostgreSQL latest)"
            version: "latest"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.2.4'

      - name: Run Integration Tests
        env:
          USE_DOCKER: "1"
          POSTGRES_VERSION: ${{ matrix.version }}
          POSTGRES_PORT: "54321"
        run: swift test --filter PostgresKitTests
